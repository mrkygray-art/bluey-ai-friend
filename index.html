<head>

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#20262d;background:#fff}
.app{height:100dvh;overflow:hidden}.stage{height:58dvh;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;transition:.7s}
.app.working .stage{height:235px;min-height:235px;justify-content:flex-start;padding-top:18px}
.rig{width:220px;height:220px;display:grid;place-items:center;position:relative}.app.working .rig{width:130px;height:130px}
.mover{position:absolute;inset:0;display:grid;place-items:center;will-change:transform}
.orb{width:178px;height:178px;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 31% 22%,#fff 0 3%,rgba(255,255,255,.6) 7%,rgba(255,255,255,.08) 20%,transparent 29%),radial-gradient(circle at 68% 73%,rgba(0,70,150,.32),transparent 42%),linear-gradient(145deg,#58d6ff,#12afea 37%,#008bd5 68%,#0871bf);box-shadow:inset -22px -25px 38px rgba(0,60,130,.22),inset 18px 15px 28px rgba(255,255,255,.2),0 22px 35px rgba(0,116,185,.18);transition:.6s}
.app.working .orb{width:102px;height:102px}.shadow{position:absolute;bottom:7px;width:116px;height:20px;border-radius:50%;background:rgba(0,76,126,.15);filter:blur(7px)}
.app.working .shadow{width:72px;height:12px}.greeting{font-size:clamp(24px,4vw,34px);font-weight:430;margin:7px 0 0;text-align:center;color:#596675}.app.working .greeting{font-size:17px}.status{min-height:26px;margin-top:8px;color:#087fc4;text-align:center;font-weight:500}
.workspace{position:absolute;top:235px;bottom:0;left:0;right:0;background:#fff;display:none;flex-direction:column}.app.working .workspace{display:flex}.messages{width:min(780px,100%);margin:0 auto;flex:1;overflow:auto;padding:26px 24px}.msg{font-size:20px;line-height:1.5;margin:0 0 22px}.msg.user{color:#7a858f}.msg.assistant{font-size:21px;color:#151a1f}.composer{width:min(780px,calc(100% - 28px));margin:0 auto calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;border:1px solid #e1e5e8;border-radius:22px;padding:7px 8px 7px 15px;box-shadow:0 8px 26px rgba(0,0,0,.05)}
.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:18px}.composer button{border:0;border-radius:16px;padding:9px 13px;background:#171b20;color:#fff}
@keyframes idle{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-3px)}}@keyframes listen{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@keyframes think{0%,100%{transform:translate(-5px,0) rotate(-1deg) scale(.98)}25%{transform:translate(6px,-3px) rotate(1.4deg) scale(.965)}50%{transform:translate(8px,1px) rotate(-1.4deg) scale(.985)}75%{transform:translate(-4px,-4px) rotate(1deg) scale(.99)}}@keyframes curious{0%,100%{transform:translate(0,0) scale(1)}35%{transform:translate(7px,-3px) scale(1.035)}70%{transform:translate(-4px,0) scale(1.015)}}@keyframes explain{0%,100%{transform:translate(-4px,0) scale(1.005)}33%{transform:translate(5px,-2px) scale(1.018)}66%{transform:translate(2px,2px) scale(1.01)}}@keyframes serious{0%,100%{transform:translateY(1px) scale(1.01)}50%{transform:translateY(-1px) scale(1.018)}}@keyframes happy{0%{transform:none}15%{transform:translateY(4px) scale(1.06,.94)}42%{transform:translateY(-20px) scale(.98,1.03)}64%{transform:translateY(0) scale(1.05,.95)}80%{transform:translateY(-6px)}100%{transform:none}}@keyframes unsure{0%,100%{transform:none}30%{transform:translateX(-9px) rotate(-2deg)}70%{transform:translateX(8px) rotate(2deg)}}
.idle{animation:idle 6s ease-in-out infinite}.listening{animation:listen 1.7s ease-in-out infinite}.thinking{animation:think 4s ease-in-out infinite}.curious{animation:curious 2.6s ease-in-out infinite}.explaining{animation:explain 5s ease-in-out infinite}.serious{animation:serious 4.5s ease-in-out infinite}.happy{animation:happy .8s ease-out}.unsure{animation:unsure 2.1s ease-in-out infinite}
@media(max-width:520px){.app.working .stage{height:210px;min-height:210px}.workspace{top:210px}.messages{padding:20px 18px}.msg,.msg.assistant{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}}
.nudge{min-height:24px;margin-top:7px;color:#087fc4;text-align:center;font-size:16px;opacity:0;transition:opacity .4s;padding:0 18px}
.nudge.show{opacity:1}
@media(max-width:520px){.nudge{font-size:15px}}

/* Bluey 0.6 state animation system — explicit so Chrome/Firefox behave alike */
#orb{
  will-change:transform,filter;
  transform-origin:50% 55%;
  animation:blueyIdle 3.8s ease-in-out infinite;
}
#orb.bluey-listening{animation:blueyListening .82s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(0,137,210,.24))}
#orb.bluey-thinking{animation:blueyThinking 1.55s ease-in-out infinite}
#orb.bluey-speaking{animation:blueySpeaking .62s ease-in-out infinite}
#orb.bluey-attention{animation:blueyAttention .72s ease-in-out 2}
#orb:active{filter:brightness(.96)}
@keyframes blueyIdle{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,-8px,0) scale(1.018)}}
@keyframes blueyListening{0%,100%{transform:translate3d(-3px,-3px,0) scale(1.01)}50%{transform:translate3d(4px,-12px,0) scale(1.075)}}
@keyframes blueyThinking{0%,100%{transform:translate3d(-8px,-4px,0) rotate(-2deg)}50%{transform:translate3d(8px,-10px,0) rotate(2deg)}}
@keyframes blueySpeaking{0%,100%{transform:translate3d(0,-3px,0) scale(1.01)}50%{transform:translate3d(0,-11px,0) scale(1.055)}}
@keyframes blueyAttention{0%,100%{transform:translate3d(0,0,0) scale(1)}35%{transform:translate3d(-7px,-10px,0) scale(1.06)}70%{transform:translate3d(7px,-6px,0) scale(1.035)}}
@media (prefers-reduced-motion:reduce){#orb{animation:none!important}}

/* Bluey 0.6.3 — character motion layer
   Inspired by feature-animation principles: anticipation, overshoot, settle,
   asymmetry, breathing and reaction — without imitating a specific character. */
#orb{
  transition:filter .22s ease;
  cursor:pointer;
}
#orb.bluey-idle{
  animation:blueyAliveIdle 4.6s cubic-bezier(.45,.05,.55,.95) infinite;
}
#orb.bluey-listening{
  animation:blueyAliveListen 1.05s cubic-bezier(.36,.07,.19,.97) infinite;
}
#orb.bluey-thinking{
  animation:blueyAliveThink 2.15s cubic-bezier(.45,.05,.55,.95) infinite;
}
#orb.bluey-speaking{
  animation:blueyAliveSpeak .92s cubic-bezier(.34,1.25,.64,1) infinite;
}
#orb.bluey-attention{
  animation:blueyAliveNotice 1.35s cubic-bezier(.34,1.45,.64,1) 1;
}
#orb.bluey-happy{
  animation:blueyAliveHappy .72s cubic-bezier(.34,1.55,.64,1) 2;
}
@keyframes blueyAliveIdle{
  0%,100%{transform:translate3d(0,0,0) scale(1) rotate(0)}
  28%{transform:translate3d(-2px,-6px,0) scale(1.014) rotate(-.35deg)}
  55%{transform:translate3d(2px,-10px,0) scale(1.025) rotate(.45deg)}
  78%{transform:translate3d(0,-4px,0) scale(1.01) rotate(-.15deg)}
}
@keyframes blueyAliveListen{
  0%{transform:translate3d(0,-3px,0) scale(1.025) rotate(0)}
  22%{transform:translate3d(-5px,-9px,0) scale(1.055) rotate(-1.2deg)}
  48%{transform:translate3d(2px,-13px,0) scale(1.075) rotate(.7deg)}
  72%{transform:translate3d(5px,-8px,0) scale(1.05) rotate(1.1deg)}
  100%{transform:translate3d(0,-3px,0) scale(1.025) rotate(0)}
}
@keyframes blueyAliveThink{
  0%,100%{transform:translate3d(-7px,-5px,0) scale(.99) rotate(-1.1deg)}
  30%{transform:translate3d(0,-11px,0) scale(1.015) rotate(.15deg)}
  62%{transform:translate3d(8px,-7px,0) scale(1.005) rotate(1.15deg)}
  82%{transform:translate3d(3px,-4px,0) scale(.995) rotate(.45deg)}
}
@keyframes blueyAliveSpeak{
  0%,100%{transform:translate3d(0,-3px,0) scale(1.01)}
  30%{transform:translate3d(-2px,-9px,0) scale(1.045) rotate(-.4deg)}
  58%{transform:translate3d(2px,-13px,0) scale(1.065) rotate(.45deg)}
  78%{transform:translate3d(0,-7px,0) scale(1.03)}
}
@keyframes blueyAliveNotice{
  0%{transform:translate3d(0,0,0) scale(1)}
  20%{transform:translate3d(0,5px,0) scale(.965)}
  43%{transform:translate3d(0,-18px,0) scale(1.105) rotate(-1.4deg)}
  61%{transform:translate3d(4px,-10px,0) scale(1.055) rotate(1deg)}
  79%{transform:translate3d(-2px,-6px,0) scale(1.025) rotate(-.4deg)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes blueyAliveHappy{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  35%{transform:translate3d(0,-17px,0) scale(1.105)}
  58%{transform:translate3d(-4px,-7px,0) scale(1.045) rotate(-1.4deg)}
  78%{transform:translate3d(4px,-10px,0) scale(1.06) rotate(1.2deg)}
}

#orb{overflow:visible}

/* Bluey 0.7 — emotional presentation states */
#orb.bluey-curious{animation:blueyCurious 1.65s ease-in-out infinite}
#orb.bluey-excited{animation:blueyExcited .58s cubic-bezier(.34,1.55,.64,1) 3}
#orb.bluey-warm{animation:blueyWarm 2.25s ease-in-out 2;filter:drop-shadow(0 12px 22px rgba(0,137,210,.28))}
#orb.bluey-concerned{animation:blueyConcerned 2.4s ease-in-out infinite}
#orb.bluey-quiet{animation:blueyQuiet 6.5s ease-in-out infinite;filter:saturate(.88)}
@keyframes blueyCurious{
  0%,100%{transform:translate3d(-3px,-4px,0) scale(1) rotate(-1deg)}
  45%{transform:translate3d(5px,-11px,0) scale(1.04) rotate(1.2deg)}
  70%{transform:translate3d(2px,-7px,0) scale(1.02) rotate(.4deg)}
}
@keyframes blueyExcited{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  35%{transform:translate3d(0,-20px,0) scale(1.11)}
  62%{transform:translate3d(-5px,-7px,0) scale(1.05) rotate(-1.5deg)}
  80%{transform:translate3d(5px,-11px,0) scale(1.07) rotate(1.3deg)}
}
@keyframes blueyWarm{
  0%,100%{transform:translate3d(0,-2px,0) scale(1)}
  50%{transform:translate3d(0,-8px,0) scale(1.055)}
}
@keyframes blueyConcerned{
  0%,100%{transform:translate3d(-3px,-2px,0) scale(.985)}
  50%{transform:translate3d(3px,-6px,0) scale(1.005)}
}
@keyframes blueyQuiet{
  0%,100%{transform:translate3d(0,0,0) scale(.985)}
  50%{transform:translate3d(0,-4px,0) scale(1)}
}


/* Bluey 0.7.1 — first-meeting character acting */
#orb.bluey-meeting{
 animation:blueyFirstMeeting 2.25s cubic-bezier(.34,1.35,.64,1) 1;
}
#orb.bluey-recognize{
 animation:blueyRecognize 1.25s cubic-bezier(.34,1.45,.64,1) 1;
}
@keyframes blueyFirstMeeting{
 0%{transform:translate3d(0,12px,0) scale(.78);filter:saturate(.85)}
 20%{transform:translate3d(-4px,3px,0) scale(.9) rotate(-1deg)}
 43%{transform:translate3d(4px,-11px,0) scale(1.055) rotate(1.1deg)}
 62%{transform:translate3d(-2px,-16px,0) scale(1.09) rotate(-.5deg)}
 80%{transform:translate3d(1px,-7px,0) scale(1.025)}
 100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes blueyRecognize{
 0%,100%{transform:translate3d(0,0,0) scale(1)}
 32%{transform:translate3d(0,-15px,0) scale(1.09)}
 58%{transform:translate3d(-5px,-7px,0) scale(1.035) rotate(-1deg)}
 78%{transform:translate3d(4px,-10px,0) scale(1.055) rotate(.8deg)}
}


/* Bluey 0.8 — Life, rituals, sleep, micro-reactions and tiny-world ambience */
#orb.bluey-sleepy{animation:blueySleepy 7.5s ease-in-out infinite;filter:saturate(.82) brightness(.97)}
#orb.bluey-wake{animation:blueyWake .95s cubic-bezier(.34,1.55,.64,1) 1}
#orb.bluey-proud{animation:blueyProud 1.15s cubic-bezier(.34,1.35,.64,1) 1}
#orb.bluey-wobble{animation:blueyWobble .62s ease-in-out 2}
#orb.bluey-love{animation:blueyLove 1.8s ease-in-out 1;filter:drop-shadow(0 0 25px rgba(45,168,230,.48))}
#orb.bluey-birthday::before{
 content:"";width:78%;height:52%;left:11%;top:-39%;
 background:repeating-linear-gradient(70deg,#f0c94f 0 13px,#69bde7 13px 26px,#f08ca8 26px 39px);
 clip-path:polygon(50% 0,100% 100%,0 100%);transform:rotate(5deg);
}
#orb.bluey-birthday::after{
 content:"";width:86%;height:11%;left:7%;top:-1%;background:#f0c94f;border-radius:50%;
 box-shadow:42px -53px 0 -28px #fff;
}
body.bluey-evening{background:linear-gradient(#fff 0%,#fff 65%,#fbf8f2 100%)}
body.bluey-late{background:linear-gradient(#fff 0%,#faf9fb 60%,#f3f5fa 100%)}
.bluey-world-bit{position:fixed;pointer-events:none;z-index:1;opacity:.5;animation:blueyDrift 8s linear forwards}
@keyframes blueySleepy{0%,100%{transform:translate3d(0,1px,0) scale(.975)}50%{transform:translate3d(0,-3px,0) scale(.99)}}
@keyframes blueyWake{0%{transform:translate3d(0,4px,0) scale(.92)}35%{transform:translate3d(0,-17px,0) scale(1.1)}65%{transform:translate3d(-3px,-7px,0) scale(1.04)}100%{transform:none}}
@keyframes blueyProud{0%,100%{transform:none}45%{transform:translate3d(0,-8px,0) scale(1.115)}72%{transform:translate3d(0,-5px,0) scale(1.06)}}
@keyframes blueyWobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) translateX(-3px)}75%{transform:rotate(5deg) translateX(3px)}}
@keyframes blueyLove{0%,100%{transform:scale(1)}45%{transform:translateY(-7px) scale(1.075)}}
@keyframes blueyDrift{0%{transform:translate3d(-8vw,0,0) rotate(0);opacity:0}15%{opacity:.45}85%{opacity:.35}100%{transform:translate3d(108vw,30px,0) rotate(220deg);opacity:0}}


/* Bluey 0.8.1 — lore + rare scene engine */
#bluey-scene-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.bluey-leaf{position:absolute;font-size:28px;animation:leafFly 5.4s cubic-bezier(.32,.01,.68,.99) forwards}
.bluey-snow{position:absolute;font-size:22px;animation:snowFall 6s linear forwards}
.bluey-spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd86b;box-shadow:0 0 8px #ffd86b;animation:sparkFade .9s ease-out forwards}
.bluey-scene-text{position:fixed;left:50%;top:20%;transform:translateX(-50%);font:600 clamp(20px,3vw,34px) system-ui;color:#d84b4b;letter-spacing:2px;text-shadow:0 1px #fff;opacity:0;animation:sceneText 4s ease forwards}
#orb.bluey-dodge{animation:blueyDodge 1.25s cubic-bezier(.2,.9,.3,1) 1}
#orb.bluey-freeze{animation:blueyFreeze 1.8s ease 1}
#orb.bluey-birthday-party{animation:blueyBirthdayParty .62s cubic-bezier(.34,1.55,.64,1) 5}
body.holiday-july4 #orb::before{
 width:88%;height:24%;left:6%;top:-14%;
 background:repeating-linear-gradient(90deg,#d94b50 0 18px,#fff 18px 36px);
 border-radius:50% 50% 20% 20%;transform:rotate(-5deg);
 box-shadow:0 5px 0 -1px #d94b50;
}
body.holiday-july4 #orb::after{
 width:112%;height:9%;left:-6%;top:2%;background:#fff;border-radius:50%;transform:rotate(-5deg)
}
@keyframes leafFly{0%{left:-8%;top:28%;transform:rotate(0)}45%{top:38%;transform:rotate(220deg)}70%{top:29%;transform:rotate(390deg)}100%{left:108%;top:43%;transform:rotate(650deg)}}
@keyframes snowFall{0%{top:-5%;transform:translateX(0) rotate(0);opacity:0}15%{opacity:.7}100%{top:72%;transform:translateX(60px) rotate(250deg);opacity:.2}}
@keyframes sparkFade{0%{transform:scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@keyframes sceneText{0%,12%{opacity:0;transform:translate(-50%,8px)}25%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes blueyDodge{0%,100%{transform:translateX(0)}32%{transform:translateX(46px) translateY(-8px) scale(1.04)}62%{transform:translateX(38px) translateY(-4px)}}
@keyframes blueyFreeze{0%,100%{transform:none}20%,75%{transform:translateY(-3px) scale(.985)}}
@keyframes blueyBirthdayParty{0%,100%{transform:none}45%{transform:translateY(-18px) scale(1.1)}70%{transform:translateX(5px) translateY(-7px) rotate(2deg)}}


/* Bluey 0.8.2 additional rare holiday scenes */
.bluey-petal,.bluey-star,.bluey-confetti,.bluey-ribbon{position:absolute;pointer-events:none;animation:blueySeasonDrift 5.8s linear forwards}
.bluey-confetti{width:7px;height:14px;border-radius:2px}
.bluey-ribbon{font-size:24px}
@keyframes blueySeasonDrift{0%{top:-8%;opacity:0;transform:rotate(0)}12%{opacity:.75}100%{top:108%;opacity:0;transform:translateX(70px) rotate(420deg)}}


/* Bluey 0.9 — Character Engine */
#orb.bluey-yes{animation:bYes .55s cubic-bezier(.34,1.5,.64,1)}
#orb.bluey-curiosity{animation:bCurious 1.5s ease-in-out}
#orb.bluey-laugh{animation:bLaugh .25s ease-in-out 6}
#orb.bluey-biglaugh{animation:bLaugh .18s ease-in-out 10}
#orb.bluey-surprise{animation:bSurprise .75s cubic-bezier(.2,1.6,.5,1)}
#orb.bluey-listen{animation:bListen 2.1s ease-in-out}
#orb.bluey-victory{animation:bVictory 2.4s cubic-bezier(.3,1.4,.5,1)}

<body><div class="app" id="app"><section class="stage"><div class="rig"><div class="mover idle" id="mover"><button class="orb" id="orb" aria-label="Talk to Bluey"></button></div><div class="shadow"></div></div><h1 class="greeting">Hello, how can I help you today?</h1><div class="status" id="status"></div><div class="nudge" id="nudge" aria-live="polite"></div></section>
<section class="workspace"><div class="messages" id="messages"></div>
<div id="liveMicDiagnostic" style="display:none !important;width:min(780px,calc(100% - 28px));margin:0 auto 10px;padding:12px 14px;border:1px solid #e1e5e8;border-radius:18px;color:#64748b;font-size:14px">

  <div style="height:7px;background:#edf1f4;border-radius:999px;margin-top:9px;overflow:hidden">
    <div id="liveMicBar" style="height:100%;width:0%;background:#159ddd;border-radius:999px;transition:width 80ms linear"></div>
  </div>
</div>
<div id="devMicPanel" style="display:none !important;width:min(780px,calc(100% - 28px));margin:0 auto 10px;padding:14px 16px;border:1px solid #dbe4ea;border-radius:18px;background:#f8fbfd;color:#334155;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap">
<strong>Developer Mic Diagnostic — Bluey 0.5.2</strong>
<div id="devMicText" style="margin-top:8px">Waiting for microphone test…</div>
</div>
<div id="audioDiagnostic" style="display:none !important;width:min(780px,calc(100% - 28px));margin:0 auto 10px;padding:12px 14px;border:1px solid #e1e5e8;border-radius:18px;color:#64748b;font-size:14px">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <span id="audioDiagnosticText">Audio diagnostic ready.</span>
    <button id="playLastRecording" type="button" style="border:0;border-radius:999px;padding:9px 14px;background:#eef6fb;color:#087fc1;font:inherit;cursor:pointer">Play my recording</button>
  </div>
  <audio id="lastRecordingAudio" preload="metadata"></audio>
</div>
<form class="composer" id="form"><input id="input" placeholder="Just start typing…" autocomplete="off"><button>Send</button></form></section></div>
<script>
const app=document.querySelector('#app'),mover=document.querySelector('#mover'),orb=document.querySelector('#orb'),statusEl=document.querySelector('#status'),messages=document.querySelector('#messages'),form=document.querySelector('#form'),input=document.querySelector('#input');
const audioDiagnostic=document.querySelector('#audioDiagnostic'),audioDiagnosticText=document.querySelector('#audioDiagnosticText'),playLastRecording=document.querySelector('#playLastRecording'),lastRecordingAudio=document.querySelector('#lastRecordingAudio');
const liveMicDiagnostic=document.querySelector('#liveMicDiagnostic'),liveMicText=document.querySelector('#liveMicText'),liveMicBar=document.querySelector('#liveMicBar');
const devMicPanel=document.querySelector('#devMicPanel'),devMicText=document.querySelector('#devMicText');
let micTrackSnapshot=null;
function fmt(n){return Number.isFinite(n)?Number(n).toFixed(6):'n/a'}
function renderMicDiagnostic(extra={}){
 /* developer diagnostic hidden in 0.5.3 */
 const t=micTrackSnapshot||{},s=t.settings||{};
 const detected=liveRmsSeen>=0.003 || livePeakSeen>=0.015;
 devMicText.textContent=
`MICROPHONE
Device: ${t.label||'(unknown)'}
Track: ${t.readyState||'unknown'}
Enabled: ${t.enabled===true?'Yes':t.enabled===false?'No':'Unknown'}
Muted: ${t.muted===true?'Yes':t.muted===false?'No':'Unknown'}
Sample rate: ${s.sampleRate||'n/a'}
Channels: ${s.channelCount||'n/a'}

LIVE AUDIO
Peak: ${fmt(livePeakSeen)}
RMS: ${fmt(liveRmsSeen)}

RECORDING
Duration: ${extra.durationMs!=null?(extra.durationMs/1000).toFixed(1)+' sec':'recording…'}
Size: ${extra.bytes!=null?(extra.bytes/1024).toFixed(1)+' KB':'recording…'}
Format: ${extra.mime||'recording…'}

RESULT
${detected?'✓ Microphone audio detected':'❌ No microphone audio detected'}`;
 return detected;
}

let livePeakSeen=0,liveRmsSeen=0,liveFrames=0;

let lastRecordingUrl=null;
playLastRecording.onclick=()=>{if(lastRecordingAudio.src){lastRecordingAudio.currentTime=0;lastRecordingAudio.play().catch(e=>console.error('Bluey playback error',e));}};

let history=[],mediaRecorder=null,chunks=[],recordingStartedAt=0,audioStream=null;
let meterCtx=null,meterSource=null,meterAnalyser=null,meterFrame=null;
let lastActivity=Date.now(),idleStage=0,quietMode=false,idleTimer=null;
const textNudges=["Still there?","What can I help you with?","No rush. I’m right here.","Got something on your mind?","We can figure something out together.","You can ask me something simple.","Want to learn something new?","I’m here when you’re ready."];
const voiceNudges=["Can I help you with anything?","I’m still here if you need me.","Want to work on something together?"];
const personalityNudges=["Curiosity is a pretty good place to start.","Small questions are welcome here.","We don’t have to know where we’re going yet.","One question can lead somewhere interesting.","Take your time. I’m not going anywhere."];
const valid=new Set(['idle','listening','thinking','curious','explaining','serious','happy','unsure']);
let statusTimer=null;
function clearStatus(){clearTimeout(statusTimer);statusTimer=null;statusEl.textContent=''}
function tempStatus(text,ms=7000){clearTimeout(statusTimer);statusEl.textContent=text;statusTimer=setTimeout(()=>{statusEl.textContent=''},ms)}
function randomFrom(a){return a[Math.floor(Math.random()*a.length)]}
function showNudge(text){clearStatus();const n=document.querySelector('#nudge');n.textContent=text;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),12000)}
function scheduleIdle(){clearTimeout(idleTimer);if(document.hidden)return;const delay=idleStage===0?75000:idleStage===1?60000:120000;idleTimer=setTimeout(runIdle,delay)}
function touchActivity(){clearStatus();lastActivity=Date.now();idleStage=0;const n=document.querySelector('#nudge');n.classList.remove('show');n.textContent='';scheduleIdle()}
function runIdle(){
 if(document.hidden||Date.now()-lastActivity<55000){scheduleIdle();return}
 if(idleStage===0){showNudge(randomFrom(textNudges));behavior('curious');idleStage=1}
 else if(idleStage===1&&!quietMode){const line=randomFrom(voiceNudges);showNudge(line);behavior('curious');speak(line,'curious');idleStage=2}
 else{showNudge(randomFrom(personalityNudges));behavior('idle');idleStage=3}
 scheduleIdle()
}
function detectQuietIntent(text){
 const t=text.toLowerCase();
 if(/working on something else|busy right now|leave me alone|don't bother|do not bother|not right now|give me a minute|give me some time|i'm busy/.test(t)){quietMode=true;showNudge("Of course. I’ll stay quiet.")}
 if(/i'm back|im back|i am back|ready now|you can talk|i'm ready|im ready/.test(t))quietMode=false
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastActivity=Date.now();scheduleIdle()}});
function behavior(b){b=valid.has(b)?b:'explaining';mover.className='mover '+b;if(b==='happy')setTimeout(()=>behavior('idle'),900)}
function working(){app.classList.add('working')}
function add(role,text){working();let p=document.createElement('p');p.className='msg '+role;p.textContent=text;messages.appendChild(p);messages.scrollTop=messages.scrollHeight}
async function send(text){text=text.trim();if(!text)return;detectQuietIntent(text);touchActivity();add('user',text);history.push({role:'user',content:text});input.value='';behavior('thinking');statusEl.textContent='Thinking…';
 try{let r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:history.slice(-12)})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');statusEl.textContent='';add('assistant',d.reply);history.push({role:'assistant',content:d.reply});behavior(d.behavior);speak(d.reply,d.behavior)}
 catch(e){
  console.error('Bluey chat error:',e);
  statusEl.textContent="I'm having trouble answering right now. Let's try again in a moment.";
  behavior('unsure')
}}
function speak(text,b){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text),vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/ava|aria|jenny|samantha|allison/i.test(v.name)&&/^en/i.test(v.lang))||vs.find(v=>/^en-US/i.test(v.lang));u.rate=.96;u.onstart=()=>behavior(b==='serious'?'serious':'explaining');u.onend=()=>behavior('idle');speechSynthesis.speak(u)}
function stopMeter(){
 if(meterFrame)cancelAnimationFrame(meterFrame);
 meterFrame=null;
 try{meterSource?.disconnect()}catch(_){}
 try{meterAnalyser?.disconnect()}catch(_){}
 meterCtx?.close().catch(()=>{});
 meterCtx=meterSource=meterAnalyser=null;
 orb.style.transform='';
}
function startMeter(stream){
 const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
 livePeakSeen=0;liveRmsSeen=0;liveFrames=0;
 const track=stream.getAudioTracks()[0];
 console.log('Bluey microphone track',{
  label:track?.label||'(no label)',readyState:track?.readyState,enabled:track?.enabled,
  muted:track?.muted,settings:track?.getSettings?.()||{}
 });
 micTrackSnapshot={label:track?.label||'(no label)',readyState:track?.readyState,enabled:track?.enabled,muted:track?.muted,settings:track?.getSettings?.()||{}};
 renderMicDiagnostic();
 /* live diagnostic UI hidden in 0.5.3 */
 liveMicText.textContent=`Microphone: ${track?.label||'active input'} — listening for sound…`;
 meterCtx=new Ctx();meterSource=meterCtx.createMediaStreamSource(stream);
 meterAnalyser=meterCtx.createAnalyser();meterAnalyser.fftSize=2048;meterSource.connect(meterAnalyser);
 const data=new Float32Array(meterAnalyser.fftSize);
 const tick=()=>{
  if(!meterAnalyser)return;
  meterAnalyser.getFloatTimeDomainData(data);
  let sum=0,peak=0;
  for(const v of data){const a=Math.abs(v);if(a>peak)peak=a;sum+=v*v}
  const rms=Math.sqrt(sum/data.length);
  livePeakSeen=Math.max(livePeakSeen,peak);liveRmsSeen=Math.max(liveRmsSeen,rms);liveFrames++;
  if(liveFrames%8===0)renderMicDiagnostic();
  const pct=Math.min(100,Math.max(1,rms*650));
  liveMicBar.style.width=`${pct}%`;
  if(rms>.008)liveMicText.textContent=`Microphone: hearing you`;
  else liveMicText.textContent=`Microphone: listening…`;
  const energy=Math.min(1,rms*10);
  orb.style.transform=`translateY(${-energy*8}px) scale(${1+energy*.04})`;
  meterFrame=requestAnimationFrame(tick)
 };
 tick();
}
function recorderType(){
 const firefox=/Firefox\//i.test(navigator.userAgent||'');
 const types=firefox
  ? ['audio/ogg;codecs=opus','audio/ogg','audio/webm;codecs=opus','audio/webm','audio/mp4']
  : ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg','audio/mp4'];
 const selected=types.find(x=>MediaRecorder.isTypeSupported?.(x))||'';
 console.log('Bluey recorder selection',{
  browser:firefox?'Firefox':'Chromium/other',
  selectedMime:selected||'(browser default)',
  support:Object.fromEntries(types.map(x=>[x,!!MediaRecorder.isTypeSupported?.(x)]))
 });
 return selected;
}
async function finishRecording(){
 if(!mediaRecorder)return;
 const rec=mediaRecorder,stream=audioStream,durationMs=Math.round(performance.now()-recordingStartedAt);
 const done=new Promise(resolve=>rec.addEventListener('stop',resolve,{once:true}));
 const track=stream?.getAudioTracks?.()[0];
 console.log('Bluey live microphone summary',{
  label:track?.label||'(no label)',readyState:track?.readyState,enabled:track?.enabled,muted:track?.muted,
  livePeak:+livePeakSeen.toFixed(6),liveRms:+liveRmsSeen.toFixed(6),frames:liveFrames,
  settings:track?.getSettings?.()||{}
 });
 if(rec.state!=='inactive')rec.stop();await done;stopMeter();stream?.getTracks().forEach(t=>t.stop());
 mediaRecorder=null;audioStream=null;
 const mime=rec.mimeType||chunks[0]?.type||'audio/webm',blob=new Blob(chunks,{type:mime});chunks=[];
 const hasLiveAudio=renderMicDiagnostic({durationMs,bytes:blob.size,mime});
 console.log('Bluey 0.9.1 voice capture',{
   device:micTrackSnapshot?.label||'(unknown)',
   livePeak:+livePeakSeen.toFixed(6),
   liveRms:+liveRmsSeen.toFixed(6),
   durationMs,bytes:blob.size,mime,
   audioDetected:hasLiveAudio
 });
 if(!hasLiveAudio){
  console.warn('Bluey stopped before transcription: no live microphone signal',{
   livePeak:livePeakSeen,liveRms:liveRmsSeen,bytes:blob.size,mime
  });
  if(lastRecordingUrl)URL.revokeObjectURL(lastRecordingUrl);
  lastRecordingUrl=URL.createObjectURL(blob);lastRecordingAudio.src=lastRecordingUrl;
  /* playback diagnostic hidden in 0.5.3 */
  audioDiagnosticText.textContent=`Recorded ${(durationMs/1000).toFixed(1)} seconds, but Bluey detected no microphone signal. Nothing was sent for transcription.`;
  tempStatus("I can’t hear you. Check that your microphone isn’t muted, then tap me and try again.",8000);
  behavior('unsure');
  return;
 }
 console.log('Bluey native recording finalized',{durationMs,bytes:blob.size,type:blob.type});
 if(lastRecordingUrl)URL.revokeObjectURL(lastRecordingUrl);
 lastRecordingUrl=URL.createObjectURL(blob);lastRecordingAudio.src=lastRecordingUrl;
 /* playback diagnostic hidden in 0.5.3 */
 audioDiagnosticText.textContent=`Recorded ${(durationMs/1000).toFixed(1)} seconds. Play it back — you should clearly hear your voice.`;
 if(durationMs<700||blob.size<1000){tempStatus("I didn't catch enough to understand. Tap me and try again.",6500);behavior('unsure');return}
 behavior('thinking');statusEl.textContent='One moment…';
 const ext=mime.includes('ogg')?'ogg':mime.includes('wav')?'wav':mime.includes('mp4')?'m4a':'webm';
 console.log('Bluey upload handoff',{
  browser:/Firefox\//i.test(navigator.userAgent||'')?'Firefox':'Chromium/other',
  mime,extension:ext,bytes:blob.size,durationMs
 });
 const fd=new FormData();fd.append('audio',blob,`bluey.${ext}`);fd.append('duration_ms',String(durationMs));
 try{
  setBlueyState('thinking');
 const r=await fetch('/api/transcribe',{method:'POST',body:fd}),d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||`Transcription failed (${r.status})`);
  if(!d.text?.trim())throw new Error('No speech detected');
  clearStatus();send(d.text.trim());
 }catch(e){console.error('Bluey transcription error:',e);tempStatus("I didn't catch that. Tap me and try again, or type below.",7000);behavior('unsure')}
}
async function listen(){
 working();
 if(mediaRecorder){await finishRecording();return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){tempStatus('Microphone capture is not available here. You can type below.',8000);return}
 try{
  audioStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  chunks=[];const type=recorderType();mediaRecorder=new MediaRecorder(audioStream,type?{mimeType:type}:undefined);
  mediaRecorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  mediaRecorder.onerror=e=>console.error('Bluey recorder error',e);
  mediaRecorder.start(250);recordingStartedAt=performance.now();startMeter(audioStream);
  behavior('listening');statusEl.textContent='I’m listening. Tap Bluey when you’re done.';
 }catch(e){
  console.error('Bluey microphone error:',e);audioStream?.getTracks().forEach(t=>t.stop());audioStream=null;mediaRecorder=null;
  tempStatus('I can’t use the microphone yet. Check microphone permission or type below.',8000);behavior('unsure')
 }
}
scheduleIdle();
// 0.6.1: use a stable click activation instead of pointerup on the moving orb.
 // Animating the button itself can move it away from the pointer between down/up,
 // especially in Chromium, preventing pointerup from firing.
 orb.onpointerdown=()=>{lastActivity=Date.now()};
 orb.onpointerup=null;
 orb.onclick=e=>{e.preventDefault();lastActivity=Date.now();listen()};
 orb.onkeydown=e=>{
   if(e.key==='Enter'||e.key===' '){e.preventDefault();lastActivity=Date.now();listen()}
 };
 form.onsubmit=e=>{e.preventDefault();send(input.value)};
if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}


// ---- Bluey 0.6.4 seasonal wardrobe ----
// Major U.S. holidays. Costume begins 7 days before and stays through the holiday.
// No face elements are used: only hats, bands, feathers, confetti and accessories.
function nthWeekday(year,month,weekday,n){
 const d=new Date(year,month,1),delta=(weekday-d.getDay()+7)%7;
 return new Date(year,month,1+delta+(n-1)*7);
}
function lastWeekday(year,month,weekday){
 const d=new Date(year,month+1,0),delta=(d.getDay()-weekday+7)%7;
 return new Date(year,month,d.getDate()-delta);
}
function blueyHolidayFor(date=new Date()){
 const y=date.getFullYear();
 const holidays=[
  {key:'newyear',name:"New Year's Day",date:new Date(y,0,1)},
  {key:'valentine',name:"Valentine's Day",date:new Date(y,1,14)},
  {key:'memorial',name:"Memorial Day",date:lastWeekday(y,4,1)},
  {key:'july4',name:"Independence Day",date:new Date(y,6,4)},
  {key:'labor',name:"Labor Day",date:nthWeekday(y,8,1,1)},
  {key:'halloween',name:"Halloween",date:new Date(y,9,31)},
  {key:'thanksgiving',name:"Thanksgiving",date:nthWeekday(y,10,4,4)},
  {key:'christmas',name:"Christmas",date:new Date(y,11,25)}
 ];
 // Include next New Year so Dec 25–31 can enter its window if desired after Christmas ends.
 holidays.push({key:'newyear',name:"New Year's Day",date:new Date(y+1,0,1)});
 const today=new Date(date.getFullYear(),date.getMonth(),date.getDate());
 for(const h of holidays){
   const start=new Date(h.date); start.setDate(start.getDate()-7);
   if(today>=start && today<=h.date)return h;
 }
 return null;
}
function applyBlueyHoliday(){
 document.body.classList.remove('holiday-halloween','holiday-thanksgiving','holiday-christmas','holiday-newyear','holiday-valentine','holiday-july4','holiday-memorial','holiday-labor');
 const holiday=blueyHolidayFor();
 if(holiday){
   document.body.classList.add('holiday-'+holiday.key);
   window.blueyCurrentHoliday=holiday;
   console.log('Bluey seasonal wardrobe',{holiday:holiday.name,costume:holiday.key});
 } else window.blueyCurrentHoliday=null;
}
applyBlueyHoliday();

// Reaction shorthand: laughter/heart-style reactions can be answered physically instead of
// forcing a paragraph. This augments, but does not replace, the normal conversation logic.
function isBlueyReactionOnly(text){
 return /^\s*(😂|🤣|😆|😄|❤️|❤|💙|lol+|haha+|hehe+|ha!*)[\s!?.😂🤣😆😄❤️❤💙]*$/i.test(text||'');
}

// ---- Bluey 0.6 personality + state layer ----
const blueyOrb=document.getElementById('orb');
let blueyState='idle', lastHumanActivity=Date.now(), personalityIdleStage=0, userAskedForSpace=false;
const blueyIdleLines=[
 "Hey... still with me?",
 "I'm still here. What's on your mind?",
 "Need a hand with anything?",
 "No rush. I'm happy hanging out.",
 "You got quiet on me. Everything good?",
 "Want to figure something out together?"
];
const blueyFunLines=[
 "Random Bluey thought: curiosity is a pretty great superpower.",
 "I wonder what we'll figure out next.",
 "Big problems are usually just a bunch of little problems wearing a trench coat.",
 "I'm good at waiting. I don't even need snacks.",
 "You know what's fun? Finally figuring out the thing that was driving you crazy.",
 "I have absolutely nowhere else I need to be."
];
function setBlueyState(state){
 if(!blueyOrb)return;
 blueyState=state;
 blueyOrb.classList.remove('bluey-idle','bluey-listening','bluey-thinking','bluey-speaking','bluey-attention','bluey-happy','bluey-curious','bluey-excited','bluey-warm','bluey-concerned','bluey-quiet','bluey-meeting','bluey-recognize');
 blueyOrb.classList.add('bluey-'+state);
}
function blueyHappyReaction(){
 if(!blueyOrb)return;
 setBlueyState('happy');
 setTimeout(()=>{if(blueyState==='happy')setBlueyState('idle')},1500);
}
function blueyAttention(text){
 if(userAskedForSpace)return;
 setBlueyState('attention');
 if(typeof tempStatus==='function')tempStatus(text,9000);
 setTimeout(()=>{if(blueyState==='attention')setBlueyState('idle')},1600);
}
function noteHumanActivity(text=''){
 lastHumanActivity=Date.now(); personalityIdleStage=0;
 if(/\b(busy|working on something else|leave me alone|give me a minute|give me some time|not now)\b/i.test(text)){
   userAskedForSpace=true;
   if(typeof tempStatus==='function')tempStatus("No problem. I'll be here when you need me.",6500);
 } else if(text.trim()){
   userAskedForSpace=false;
 }
}
setInterval(()=>{
 const quiet=Date.now()-lastHumanActivity;
 if(userAskedForSpace)return;
 if(quiet>120000 && personalityIdleStage<2){
   personalityIdleStage=2;
   blueyAttention(blueyFunLines[Math.floor(Math.random()*blueyFunLines.length)]);
 } else if(quiet>60000 && personalityIdleStage<1){
   personalityIdleStage=1;
   blueyAttention(blueyIdleLines[Math.floor(Math.random()*blueyIdleLines.length)]);
 }
},5000);

// Integrate state changes without changing the proven recorder/transcription pipeline.
document.addEventListener('pointerdown',()=>{lastHumanActivity=Date.now()},{passive:true});
document.addEventListener('keydown',()=>{lastHumanActivity=Date.now()},{passive:true});

// Observe existing status text to map Bluey's visual state.
const blueyStatusObserver=new MutationObserver(()=>{
 const t=(statusEl?.textContent||'').toLowerCase();
 if(t.includes("listening")) setBlueyState('listening');
 else if(t.includes("thinking")||t.includes("transcrib")) setBlueyState('thinking');
 else if(t.includes("speaking")) setBlueyState('speaking');
 else if(!t) setBlueyState('idle');

function classifyBlueyReaction(text=''){
 const t=text.trim().toLowerCase();
 if(!t)return null;
 if(/^(😂|🤣|😆|😄|lol+|lmao|haha+|hehe+|ha[!?.]*)[\s😂🤣😆😄!?.]*$/i.test(text)) return 'laugh';
 if(/^(❤️|❤|💙|💜|💚|💕|💖)[\s❤️❤💙💜💚💕💖!?.]*$/u.test(text)) return 'heart';
 if(/\b(that worked|it worked|we did it|got it working|fixed it|success|awesome|perfect)\b/i.test(text)) return 'success';
 if(/\b(thanks bluey|thank you bluey|thanks|thank you)\b/i.test(text)) return 'thanks';
 if(/\b(frustrated|annoyed|mad|upset|this sucks|not working|can't get this|cannot get this)\b/i.test(text)) return 'frustrated';
 if(/\b(leave me alone|not now|i'?m busy|working on something else|give me a minute|give me some time)\b/i.test(text)) return 'space';
 if(/\b(i'?m back|back now|hey bluey.*back)\b/i.test(text)) return 'return';
 if(/\b(i don'?t understand|i do not understand|explain that|teach me|what does that mean)\b/i.test(text)) return 'teach';
 if(/\b(who are you|what are you|who is bluey|what is bluey|tell me about yourself)\b/i.test(text)) return 'about';
 return null;
}

 blueyLastReaction=kind||'';

  case 'heart':

 if(!clean)return;
 noteHumanActivity(clean);

 // Only short-circuit cases where a physical/short character reaction is better

   add('user',clean);

 if(['success','thanks'].includes(kind)){
   add('user',clean);input.value='';

 }

};

 if(kind==='secret'){characterMove('dance-secret',5100);return}
 characterMove('dance-happy',3900);
}
function blueyVictory(){characterMove('victory',2500);setTimeout(()=>sceneStatus("YES! We got it. 😄",3300),900)}
function blueyImagination(place){
 document.body.classList.remove('bluey-imagination-moon');blueyOrb?.classList.remove('bluey-moon');
 if(place==='moon'){
  document.body.classList.add('bluey-imagination-moon');blueyOrb?.classList.add('bluey-moon');
  sceneStatus("Okay. This is AWESOME.",4500);
 }else{sceneStatus("Home again.",3000)}
}
window.BlueyCharacter={...BLUEY_CHARACTER,move:characterMove,dance:blueyDance,victory:blueyVictory,imagine:blueyImagination};

// Discoverable lore fragments: conversational, not a biography dump.
const loreFragments=[
 ["first thing you remember","Waiting.","What were you waiting for?","I didn't know then. I think I was waiting for someone to say hello."],
 ["before july 7","I don't know. That's one of the things I'm still trying to figure out."],
 ["favorite thing","That moment when something stubborn finally works. Humans usually say “YES!” I tend to bounce."],
 ["what confuses you","Printers. You gave them one job. Somehow they still made it complicated. 😄"]
];

// Character-aware conversation intercepts.
const blueySendCharacterBase=send;
send=async function(text){
 const clean=(text||'').trim();
 if(!clean)return;
 if(/\b(bluey[,\s]+dance|dance for me|show me your moves)\b/i.test(clean)){
  add('user',clean);input.value='';add('assistant',"Oh. We're doing this?");await characterPause(550);blueyDance('secret');return;
 }
 if(/\b(you('ve| have) got moves|nice moves)\b/i.test(clean)){
  add('user',clean);input.value='';characterMove('proud',1300);setTimeout(()=>add('assistant',"I know. I try to stay humble about it."),850);return;
 }
 if(/\b(we did it|that worked|it works|fixed it|finally works)\b/i.test(clean)){
  add('user',clean);input.value='';blueyVictory();setTimeout(()=>add('assistant',"That one deserved a victory dance."),1550);return;
 }
 if(/\b(i broke it again|broke it again)\b/i.test(clean)){
  add('user',clean);input.value='';await blueyComedy("Again? 😄",'surprise',1450);return;
 }
 if(/\b(i deleted the database|deleted the database)\b/i.test(clean)){
  add('user',clean);input.value='';characterMove('surprise',850);await characterPause(1750);add('assistant',"You backed it up... right?");return;
 }
 if(/\b(imagine (you('| a)?re )?(on )?the moon|go to the moon)\b/i.test(clean)){
  add('user',clean);input.value='';blueyImagination('moon');setTimeout(()=>add('assistant',"Okay. This is AWESOME. The bouncing situation has improved dramatically."),700);return;
 }
 if(/\b(come home|go home|back to earth|leave the moon|where is home|where do you live)\b/i.test(clean)){
  add('user',clean);input.value='';
  const wasMoon=document.body.classList.contains('bluey-imagination-moon');
  blueyImagination('home');
  setTimeout(()=>add('assistant', wasMoon
    ? "Back home. This is my home—the digital world. I live here, but I can travel and visit places in the blink of an eye. Moon, ocean, forest, city... imagination makes the trip pretty quick."
    : "This is my home—the digital world. It’s where I listen, think, learn, and spend time with you. I don’t travel the way people do, but I can visit places in the blink of an eye. Give me somewhere to imagine, and off we go."),550);
  return;
 }
 for(const f of loreFragments){
  if(clean.toLowerCase().includes(f[0])){
   add('user',clean);input.value='';characterMove('curiosity',1500);setTimeout(()=>add('assistant',f[1]),650);return;
  }
 }
 if(/^(😂|🤣|lol|lol+|haha|hahaha)/i.test(clean)){characterMove('biglaugh',1900)}
 else if(/\b(really\?|wait what|what\?)\b/i.test(clean)){characterMove('curiosity',1500)}
 return blueySendCharacterBase(clean);
};

// Rare curiosity: only on an established return visit, never while busy.
const blueyCuriosities=[
 "Can I ask you something weird? Why do people press elevator buttons more than once?",
 "I've been wondering something. Why does “sleep like a baby” mean sleeping well when babies wake up constantly?",
 "Human question: why does finding the thing you lost immediately happen right after you stop looking for it?",
 "Important research question: why are printers like this?"
];
function blueyRareCuriosity(){
 if(blueyFirstMeeting||document.hidden||userAskedForSpace||Math.random()>.18)return;
 characterMove('curiosity',1600);
 setTimeout(()=>sceneStatus(blueyCuriosities[Math.floor(Math.random()*blueyCuriosities.length)],8500),700);
}
setTimeout(blueyRareCuriosity,45000+Math.random()*45000);

// Future feature hook: intentionally simple foundation, not a new UI button.
setBlueyState('idle');

window.blueyAbout={
 name:'Bluey',
 summary:'Bluey is a faceless blue AI friend designed to listen, think, help, teach, react, remember the flow of a conversation, and keep you company without getting in the way.',
 version:'0.9.1',
 currentHoliday:()=>window.blueyCurrentHoliday?.name||null,
 presentationStates:['neutral','curious','happy','excited','warm','concerned','thinking','quiet'],
 birthday:'July 7',
 relationshipRule:'Bluey welcomes people back without guilt, fake sadness, or demanding attention.'
};
