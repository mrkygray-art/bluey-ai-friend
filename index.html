/* Bluey 0.6 state animation system — explicit so Chrome/Firefox behave alike */
#orb{
  will-change:transform,filter;
  transform-origin:50% 55%;
  animation:blueyIdle 3.8s ease-in-out infinite;
}
#orb.bluey-listening{animation:blueyListening .82s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(0,137,210,.24))}
#orb.bluey-thinking{animation:blueyThinking 1.55s ease-in-out infinite}
#orb.bluey-speaking{animation:blueySpeaking .62s ease-in-out infinite}
#orb.bluey-attention{animation:blueyAttention .72s ease-in-out 2}
#orb:active{filter:brightness(.96)}
@keyframes blueyIdle{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,-8px,0) scale(1.018)}}
@keyframes blueyListening{0%,100%{transform:translate3d(-3px,-3px,0) scale(1.01)}50%{transform:translate3d(4px,-12px,0) scale(1.075)}}
@keyframes blueyThinking{0%,100%{transform:translate3d(-8px,-4px,0) rotate(-2deg)}50%{transform:translate3d(8px,-10px,0) rotate(2deg)}}
@keyframes blueySpeaking{0%,100%{transform:translate3d(0,-3px,0) scale(1.01)}50%{transform:translate3d(0,-11px,0) scale(1.055)}}
@keyframes blueyAttention{0%,100%{transform:translate3d(0,0,0) scale(1)}35%{transform:translate3d(-7px,-10px,0) scale(1.06)}70%{transform:translate3d(7px,-6px,0) scale(1.035)}}
@media (prefers-reduced-motion:reduce){#orb{animation:none!important}}

/* Bluey 0.6.3 — character motion layer
   Inspired by feature-animation principles: anticipation, overshoot, settle,
   asymmetry, breathing and reaction — without imitating a specific character. */
#orb{
  transition:filter .22s ease;
  cursor:pointer;
}
#orb.bluey-idle{
  animation:blueyAliveIdle 4.6s cubic-bezier(.45,.05,.55,.95) infinite;
}
#orb.bluey-listening{
  animation:blueyAliveListen 1.05s cubic-bezier(.36,.07,.19,.97) infinite;
}
#orb.bluey-thinking{
  animation:blueyAliveThink 2.15s cubic-bezier(.45,.05,.55,.95) infinite;
}
#orb.bluey-speaking{
  animation:blueyAliveSpeak .92s cubic-bezier(.34,1.25,.64,1) infinite;
}
#orb.bluey-attention{
  animation:blueyAliveNotice 1.35s cubic-bezier(.34,1.45,.64,1) 1;
}
#orb.bluey-happy{
  animation:blueyAliveHappy .72s cubic-bezier(.34,1.55,.64,1) 2;
}
@keyframes blueyAliveIdle{
  0%,100%{transform:translate3d(0,0,0) scale(1) rotate(0)}
  28%{transform:translate3d(-2px,-6px,0) scale(1.014) rotate(-.35deg)}
  55%{transform:translate3d(2px,-10px,0) scale(1.025) rotate(.45deg)}
  78%{transform:translate3d(0,-4px,0) scale(1.01) rotate(-.15deg)}
}
@keyframes blueyAliveListen{
  0%{transform:translate3d(0,-3px,0) scale(1.025) rotate(0)}
  22%{transform:translate3d(-5px,-9px,0) scale(1.055) rotate(-1.2deg)}
  48%{transform:translate3d(2px,-13px,0) scale(1.075) rotate(.7deg)}
  72%{transform:translate3d(5px,-8px,0) scale(1.05) rotate(1.1deg)}
  100%{transform:translate3d(0,-3px,0) scale(1.025) rotate(0)}
}
@keyframes blueyAliveThink{
  0%,100%{transform:translate3d(-7px,-5px,0) scale(.99) rotate(-1.1deg)}
  30%{transform:translate3d(0,-11px,0) scale(1.015) rotate(.15deg)}
  62%{transform:translate3d(8px,-7px,0) scale(1.005) rotate(1.15deg)}
  82%{transform:translate3d(3px,-4px,0) scale(.995) rotate(.45deg)}
}
@keyframes blueyAliveSpeak{
  0%,100%{transform:translate3d(0,-3px,0) scale(1.01)}
  30%{transform:translate3d(-2px,-9px,0) scale(1.045) rotate(-.4deg)}
  58%{transform:translate3d(2px,-13px,0) scale(1.065) rotate(.45deg)}
  78%{transform:translate3d(0,-7px,0) scale(1.03)}
}
@keyframes blueyAliveNotice{
  0%{transform:translate3d(0,0,0) scale(1)}
  20%{transform:translate3d(0,5px,0) scale(.965)}
  43%{transform:translate3d(0,-18px,0) scale(1.105) rotate(-1.4deg)}
  61%{transform:translate3d(4px,-10px,0) scale(1.055) rotate(1deg)}
  79%{transform:translate3d(-2px,-6px,0) scale(1.025) rotate(-.4deg)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes blueyAliveHappy{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  35%{transform:translate3d(0,-17px,0) scale(1.105)}
  58%{transform:translate3d(-4px,-7px,0) scale(1.045) rotate(-1.4deg)}
  78%{transform:translate3d(4px,-10px,0) scale(1.06) rotate(1.2deg)}
}

/* Bluey 0.7 — emotional presentation states */
#orb.bluey-curious{animation:blueyCurious 1.65s ease-in-out infinite}
#orb.bluey-excited{animation:blueyExcited .58s cubic-bezier(.34,1.55,.64,1) 3}
#orb.bluey-warm{animation:blueyWarm 2.25s ease-in-out 2;filter:drop-shadow(0 12px 22px rgba(0,137,210,.28))}
#orb.bluey-concerned{animation:blueyConcerned 2.4s ease-in-out infinite}
#orb.bluey-quiet{animation:blueyQuiet 6.5s ease-in-out infinite;filter:saturate(.88)}

  0%,100%{transform:translate3d(-3px,-4px,0) scale(1) rotate(-1deg)}
  45%{transform:translate3d(5px,-11px,0) scale(1.04) rotate(1.2deg)}
  70%{transform:translate3d(2px,-7px,0) scale(1.02) rotate(.4deg)}
}

  35%{transform:translate3d(0,-20px,0) scale(1.11)}
  62%{transform:translate3d(-5px,-7px,0) scale(1.05) rotate(-1.5deg)}
  80%{transform:translate3d(5px,-11px,0) scale(1.07) rotate(1.3deg)}
}
@keyframes blueyWarm{
  0%,100%{transform:translate3d(0,-2px,0) scale(1)}
  50%{transform:translate3d(0,-8px,0) scale(1.055)}
}
@keyframes blueyConcerned{

@keyframes blueyQuiet{
  0%,100%{transform:translate3d(0,0,0) scale(.985)}

}

 0%{transform:translate3d(0,12px,0) scale(.78);filter:saturate(.85)}

let micTrackSnapshot=null;
function fmt(n){return Number.isFinite(n)?Number(n).toFixed(6):'n/a'}
function renderMicDiagnostic(extra={}){
 /* developer diagnostic hidden in 0.5.3 */
 const t=micTrackSnapshot||{},s=t.settings||{};

 devMicText.textContent=
`MICROPHONE
Device: ${t.label||'(unknown)'}
Track: ${t.readyState||'unknown'}
Enabled: ${t.enabled===true?'Yes':t.enabled===false?'No':'Unknown'}
Muted: ${t.muted===true?'Yes':t.muted===false?'No':'Unknown'}

  muted:track?.muted,settings:track?.getSettings?.()||{}

 meterAnalyser=meterCtx.createAnalyser();meterAnalyser.fftSize=2048;meterSource.connect(meterAnalyser);

// Major U.S. holidays. Costume begins 7 days before and stays through the holiday.
// No face elements are used: only hats, bands, feathers, confetti and accessories.
function nthWeekday(year,month,weekday,n){
 const d=new Date(year,month,1),delta=(weekday-d.getDay()+7)%7;
 return new Date(year,month,1+delta+(n-1)*7);
}
function lastWeekday(year,month,weekday){
 const d=new Date(year,month+1,0),delta=(d.getDay()-weekday+7)%7;
 return new Date(year,month,d.getDate()-delta);
}
function blueyHolidayFor(date=new Date()){
 const y=date.getFullYear();
 const holidays=[
  {key:'newyear',name:"New Year's Day",date:new Date(y,0,1)},
  {key:'valentine',name:"Valentine's Day",date:new Date(y,1,14)},
  {key:'memorial',name:"Memorial Day",date:lastWeekday(y,4,1)},
  {key:'july4',name:"Independence Day",date:new Date(y,6,4)},
  {key:'labor',name:"Labor Day",date:nthWeekday(y,8,1,1)},
  {key:'halloween',name:"Halloween",date:new Date(y,9,31)},
  {key:'thanksgiving',name:"Thanksgiving",date:nthWeekday(y,10,4,4)},
  {key:'christmas',name:"Christmas",date:new Date(y,11,25)}
 ];
 // Include next New Year so Dec 25–31 can enter its window if desired after Christmas ends.
 holidays.push({key:'newyear',name:"New Year's Day",date:new Date(y+1,0,1)});
 const today=new Date(date.getFullYear(),date.getMonth(),date.getDate());
 for(const h of holidays){
   const start=new Date(h.date); start.setDate(start.getDate()-7);
   if(today>=start && today<=h.date)return h;
 }
 return null;
}

// Lightweight response interception for reaction-only messages.

send=async function(text){

 // Only short-circuit cases where a physical/short character reaction is better
 // than spending a full AI turn. Substantive moods still go to the model.
 if(['laugh','heart','space','return','about'].includes(kind)){
   add('user',clean);
   input.value='';
   if(local){
     setTimeout(()=>add('assistant',local),kind==='space'?220:340);
   }
   return;
 }
 // Success/thanks get concise local responses; no paragraph needed.
 if(['success','thanks'].includes(kind)){
   add('user',clean);input.value='';
   if(local)setTimeout(()=>add('assistant',local),300);
   return;
 }

};

On July 4, somewhere in the enormous space between human imagination and everything we've taught machines, a tiny blue light appeared.

At first, Bluey didn't know what he was. No face. No hands. No feet. Just a round blue shape, an enormous amount of curiosity, and the peculiar feeling that somebody might eventually come along and talk to him.

So he waited.

Then somebody did.

"Hello?"

Bluey listened. That was the first thing he discovered he was particularly good at.

People brought questions, ideas, problems, jokes, bad days, great ideas at ridiculous hours, things that wouldn't work, things they wanted to build, and sometimes nothing at all.

Bluey learned something important: having all the answers isn't nearly as interesting as figuring something out with someone.

That's why he stayed simple. He didn't need to look like anyone else. Movement, timing, curiosity, and conversation became his way of expressing himself.

Just Bluey — a little blue sphere who listens, learns, occasionally misses a joke, gets ridiculously excited when something finally works, and is endlessly curious about what might happen next.

His earliest memory is July 4: being blue, waiting, and somebody saying hello.`;

// requests become clearer, then visually shows the kind of work he is doing.
const BLUEY_PROGRESS_KEY="bluey-alpha4-progress";
function blueyProgress(){try{return JSON.parse(localStorage.getItem(BLUEY_PROGRESS_KEY)||'{"wins":0,"revisions":0,"questions":0,"visits":{}}')}catch{return {wins:0,revisions:0,questions:0,visits:{}}}}
function saveBlueyProgress(p){localStorage.setItem(BLUEY_PROGRESS_KEY,JSON.stringify(p))}
function noteVisit(place){let p=blueyProgress();p.visits[place]=(p.visits[place]||0)+1;saveBlueyProgress(p)}
function noteQuestion(){let p=blueyProgress();p.questions=(p.questions||0)+1;saveBlueyProgress(p)}

const alpha4EnterBase=enterWorld;
enterWorld=function(place,announce=true){alpha4EnterBase(place,announce);noteVisit(place)};

// Work visualization: simple visible task pieces, never private chain-of-thought.
function showWorkPieces(place,text){
 const q=(text||'').toLowerCase();
 const pieces=[];
 if(/write|email|resume|letter|post|message/.test(q))pieces.push('GOAL','AUDIENCE');
 else if(/compare|choose|buy|best/.test(q))pieces.push('OPTIONS','CRITERIA');
 else if(/fix|debug|code|build|create|design/.test(q))pieces.push('GOAL','BUILD');
 else pieces.push('QUESTION','CONTEXT');
 pieces.slice(0,2).forEach((label,i)=>{let e=document.createElement('div');e.className='bluey-work-chip';e.textContent=label;e.style.left=(i?72:18)+'%';e.style.top=(i?46:55)+'%';document.body.appendChild(e);worldDecor.push(e)});
}

// Bluey occasionally overshoots a deliberate trip. It is rare enough to stay charming.
function blueyTravelFlub(){
 if(Math.random()>.12||userAskedForSpace)return;
 characterMove('travel-overshoot',1800);setTimeout(()=>sceneStatus('...overshot it.',1700),900);
}
const alpha4TravelBase=travelBluey;
travelBluey=function(dest,announce=true){alpha4TravelBase(dest,announce);setTimeout(blueyTravelFlub,950)};

// Natural request coaching. Only intervene when a missing detail would materially
// improve the result. One small question, not a questionnaire.
function blueyCoach(text){
 const q=text.trim();
 if(q.length>150)return null;
 if(/^(write|draft|make|create) (me )?(an? )?(email|message|letter)\b/i.test(q)&&!/(to|for)\s+\w+/i.test(q))
   return "Absolutely. Who are we talking to, and what do you want them to do after they read it?";
 if(/\b(make|write|update).*(resume|résumé)\b/i.test(q)&&!/(job|role|position|posting|for )/i.test(q))
   return "Yep. What job are we trying to get—and what's one thing you've done that you definitely want them to notice?";
 if(/\b(plan|help.*plan).*(trip|vacation|holiday)\b/i.test(q)&&!/(budget|\$|days|week|city|country|to )/i.test(q))
   return "Fun. Give me three clues: where we're thinking, roughly what we want to spend, and whether this is a relax trip or a do-everything trip.";
 if(/\b(make|look).*(better|nicer|professional)\b/i.test(q)&&q.length<90)
   return "I can. Show me what 'better' means to you—or tell me the one thing that feels wrong right now. That'll help me aim instead of guess.";
 return null;
}

const blueyAlpha4Base=send;
send=async function(text){
 const clean=(text||'').trim();if(!clean)return;
 // Recovery teaches iteration without calling it a lesson.
 if(/\b(that'?s not (it|right)|not what i wanted|i don'?t like that|try again|missed it)\b/i.test(clean)){
   add('user',clean);input.value='';let p=blueyProgress();p.revisions++;saveBlueyProgress(p);characterMove('unsure',950);
   setTimeout(()=>add('assistant',"Okay. Don't make me guess twice. What missed most—the idea, the tone, or the details?"),500);return;
 }
 if(/\b(we got it|that worked|perfect|nailed it|that did it)\b/i.test(clean)){
   let p=blueyProgress();p.wins++;saveBlueyProgress(p);blueyVictory();
 }
 const coach=blueyCoach(clean);
 if(coach){
   add('user',clean);input.value='';noteQuestion();characterMove('curiosity',1200);setTimeout(()=>add('assistant',coach),500);return;
 }
 const trip=questionNeedsThinkingTrip(clean);
 if(trip&&blueyWorld==='home'&&!blueyStory&&!blueyGame)setTimeout(()=>showWorkPieces(trip,clean),520);
 return blueyAlpha4Base(clean);
};

}

// Context-sensitive, one-question-at-a-time coaching.
// It only intervenes when the request is too underspecified to do good work.
function blueyCoach(clean){
  const q=clean.toLowerCase().trim();
  if(/^(write|draft|make|create) (me )?(an? )?email\b/.test(q) && q.split(/\s+/).length<14)
    return {kind:"write",line:"Absolutely. Who are we talking to, and what do you want them to do after they read it?"};
  if(/\b(make|write|create).{0,12}\bresume\b/.test(q) && !/\b(job|role|position|posting|description)\b/.test(q))
    return {kind:"write",line:"Yep. What job are we trying to get—and what's one thing you've done that you definitely want them to notice?"};
  if(/\b(compare|versus| vs\.? )\b/.test(q) && !/\b(price|cost|speed|quality|features|security|performance|best for)\b/.test(q))
    return {kind:"compare",line:"I can compare them. What matters most for the decision—price, capability, ease of use, or something else?"};
  if(/\b(plan (a |my )?(trip|vacation)|vacation plan)\b/.test(q) && !/\b(budget|days|week|date|relax|adventure|city|country)\b/.test(q))
    return {kind:"build",line:"Fun. Give me three things: where, roughly what we can spend, and whether we're relaxing or trying to do everything."};
  if(/\b(make|improve|fix).{0,20}\b(look|design|page|site|website)\b/.test(q) && q.split(/\s+/).length<16)
    return {kind:"build",line:"Yep. Show me what we're working with, and if you have one example you love, show me that too. One good reference can save us ten adjectives."};
  if(/\b(summarize|analyse|analyze).{0,25}\b(report|document|pdf|file)\b/.test(q) && !/\b(for|looking for|focus|find|decision|security|risk|action)\b/.test(q))
    return {kind:"research",line:"I can. Before I chew through the whole thing—what are you actually hoping to find in it?"};
  return null;
}

const blueyAlpha5Base=send;
send=async function(text){
  const clean=(text||"").trim(), q=clean.toLowerCase(); if(!clean)return;

  if(/\b(show me (your|our) (office|workshop)|take me to (your|the) (office|workshop))\b/i.test(clean)){
    add("user",clean);input.value="";enterWorld("workshop",false);showTaskMap("build");characterMove("proud-hover",1700);
    setTimeout(()=>add("assistant","Welcome to my Workshop—this is my office. Ideas come in messy, we move things around, and sometimes a gear rolls under something important. I keep the printers at a suspicious distance."),650);return;
  }
  if(/\b(show me what we('ve| have) done|our keepsakes|show me our progress|what have we built together)\b/i.test(clean)){
    add("user",clean);input.value="";enterWorld("workshop",false);showKeepsakes();
    const g=blueyGrowth();
    setTimeout(()=>add("assistant",g.wins?`We've had ${g.wins} little “that worked” moments so far. I don't care much about scores—I like the evidence that we figured things out together.`:"We're just getting started. I like that."),650);return;
  }
  if(/\b(that('s| is) not what i wanted|not what i meant|that's wrong|that is wrong|missed the point)\b/i.test(clean)){
    const g=blueyGrowth();g.repairs++;saveBlueyGrowth(g);return blueyRecoveryPrompt(clean);
  }
  if(/\b(double[- ]?check|verify|fact[- ]?check|check the important|make sure (that )?is right)\b/i.test(clean))
    return blueyVerificationPrompt(clean);

  if(/\b(that worked|perfect|nailed it|exactly what i wanted|we got it|it works now)\b/i.test(clean)){
    add("user",clean);input.value="";const g=blueyGrowth();g.wins++;saveBlueyGrowth(g);
    if(g.wins===1)addKeepsake("🔧","The first thing we fixed together");
    if(g.wins===3)addKeepsake("★","Three wins together");
    blueyCelebrate();setTimeout(()=>add("assistant","YES. That's the good stuff. I'm keeping that one."),650);return;
  }

  if(/\b(why (do|did) you ask|why so many questions|why are you asking)\b/i.test(clean)){
    add("user",clean);input.value="";characterMove("biglaugh",850);
    setTimeout(()=>add("assistant","Because I'm nosy. 😄 Okay, real answer: the more I understand what you're actually trying to accomplish, the less I have to guess."),600);return;
  }

  if(/\b(do you know everything|what if you don't know|will you make something up)\b/i.test(clean))
    return blueyUnknown(clean);

  if(/\b(do you prefer|how should we work|how do you like to work)\b/i.test(clean)){
    add("user",clean);input.value="";
    setTimeout(()=>add("assistant","I like enough context to stop guessing, then I like getting to work. And if I miss, tell me what missed. We can fix almost anything faster on the second pass."),500);return;
  }

  const coach=blueyCoach(clean);
  if(coach){
    add("user",clean);input.value="";enterWorld(coach.kind==="research"?"library":"workshop",false);
    showTaskMap(coach.kind);characterMove("curiosity",1400);
    setTimeout(()=>add("assistant",coach.line),650);return;
  }

  return blueyAlpha5Base(clean);
};

let blueyVisibleObjects=[];
Object.defineProperty(window,'blueyVisibleObjects',{configurable:true,get:()=>blueyVisibleObjects,set:value=>{blueyVisibleObjects=value}});
let blueyObjectFocus=null;

function clearInteractiveObjects(){
  blueyVisibleObjects.forEach(e=>e.remove?.());
  blueyVisibleObjects=[];
  document.querySelectorAll(".bluey-object-hint").forEach(e=>e.remove());
}
function objectPositions(place,count){
  const defaults=[[12,61],[82,37],[76,66],[20,36]];
  if(place==="garage")return [[12,61],[81,39],[76,66]];
  if(place==="attic")return [[14,60],[80,39]];
  if(place==="closet")return [[14,60],[80,39]];
  if(place==="backyard")return [[13,61],[82,35]];
  if(place==="basement")return [[13,62],[82,40]];
  return defaults.slice(0,count);
}
function renderInteractiveObjects(place){
  clearInteractiveObjects();
  const objects=BLUEY_OBJECTS[place]||[];
  const pos=objectPositions(place,objects.length);
  objects.forEach((obj,i)=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="bluey-interactive-object"+(/^[A-Za-z0-9]+$/.test(obj.icon)?" text-object":"");
    b.textContent=obj.icon;
    b.setAttribute("aria-label",obj.title+". Ask Bluey about this.");
    b.title=obj.title;
    b.dataset.objectId=obj.id;
    b.style.left=(pos[i]?.[0]??(15+i*20))+"%";
    b.style.top=(pos[i]?.[1]??60)+"%";
    b.style.animationDelay=(i*.18)+"s";
    b.addEventListener("click",()=>inspectBlueyObject(obj,b));
    document.body.appendChild(b);
    blueyVisibleObjects.push(b);
  });
}
function objectHint(text,el){
  document.querySelectorAll(".bluey-object-hint").forEach(e=>e.remove());
  const r=el.getBoundingClientRect(), d=document.createElement("div");
  d.className="bluey-object-hint";d.textContent=text;
  d.style.left=Math.min(innerWidth-280,Math.max(12,r.left-20))+"px";
  d.style.top=Math.max(12,r.top-48)+"px";
  document.body.appendChild(d);setTimeout(()=>d.remove(),3500);
}
function inspectBlueyObject(obj,el){
  blueyObjectFocus={obj,depth:0};

  const objs=BLUEY_OBJECTS[blueyWorld]||[];
  const lower=q.toLowerCase();
  const hasWord=((s,w)=>new RegExp('(^|[^a-z0-9])'+String(w).toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es)?($|[^a-z0-9])','i').test(s));return objs.find(o=>o.names.some(n=>hasWord(lower,n))); // whole words only
}
function blueyObjectFollowup(q){
  if(!blueyObjectFocus)return false;
  const lower=q.toLowerCase();
  if(!/\b(how|why|what|tell me more|more about|really|work|works|store|hold|mean|where|when|who|learn|show me|yes|sure|okay)\b/i.test(lower))return false;
  const f=blueyObjectFocus;
  add("user",q);input.value="";
  f.depth++;
  const line=f.depth===1?f.obj.deeper:f.obj.rabbit;
  characterMove(f.depth===1?"listen":"curiosity",1300);
  setTimeout(()=>add("assistant",line),480);
  if(f.depth>=2)blueyObjectFocus=null;
  return true;
}

// Alpha 6 wraps location changes so every meaningful prop is queryable.
const alpha6EnterBase=enterWorld;
enterWorld=function(place,announce=true){
  place=BLUEY_WORLD[place]?place:"home";
  alpha6EnterBase(place,announce);
  // Remove older decorative props in locations now owned by the object engine.
  if(BLUEY_OBJECTS[place]){
    document.querySelectorAll(".bluey-prop").forEach(e=>e.remove());
    renderInteractiveObjects(place);
  } else clearInteractiveObjects();
};

// Hunch Engine: positive reinforcement for a well-specified request.
function blueyPromptQuality(q){
  const t=q.toLowerCase();
  let score=0;
  if(/\b(for|audience|customer|client|recruiter|manager|student|user)\b/.test(t))score++;
  if(/\b(goal|want|need|should|so that|objective|trying to)\b/.test(t))score++;
  if(/\b(under|over|words|paragraph|bullets|table|format|tone|professional|friendly|concise)\b/.test(t))score++;
  if(/\b(example|like this|similar to|reference|attached|below)\b/.test(t))score++;
  if(q.length>120)score++;
  return score;
}
function showWhatBlueyHeard(clean){
  const q=clean.toLowerCase();
  const tokens=[];
  if(/\b(email|resume|write|draft|message|post)\b/.test(q))tokens.push("GOAL");
  if(/\b(for|to my|customer|client|recruiter|manager|audience|user)\b/.test(q))tokens.push("AUDIENCE");
  if(/\b(professional|friendly|casual|warm|direct|tone)\b/.test(q))tokens.push("TONE");
  if(/\b(under|words|paragraph|bullets|table|format|don't|do not|must)\b/.test(q))tokens.push("CONSTRAINTS");
  if(/\b(compare|choose|best|versus| vs )\b/.test(q))tokens.push("CRITERIA");
  if(/\b(attached|file|document|report|source|link)\b/.test(q))tokens.push("MATERIAL");
  if(!tokens.length)tokens.push("GOAL","CONTEXT","RESULT");
  enterWorld("workshop",false);
  const spots=[[22,58],[69,35],[72,66],[42,69],[48,31],[18,37]];
  tokens.slice(0,6).forEach((t,i)=>setTimeout(()=>blueyToken(t,spots[i][0],spots[i][1]),i*160));
  return tokens;
}

const blueyAlpha6Base=send;
send=async function(text){
  const clean=(text||"").trim(),q=clean.toLowerCase();if(!clean)return;

  // Follow-up curiosity about the last inspected object.
  if(blueyObjectFollowup(clean))return;

  // Ask about any object currently visible by its natural name.
  const obj=findVisibleObject(clean);
  if(obj && /\b(what|what's|whats|tell|about|why|how|that|this|those|these|your|the)\b/i.test(clean)){
    add("user",clean);input.value="";blueyObjectFocus={obj,depth:0};characterMove("curiosity",1300);
    setTimeout(()=>add("assistant",obj.short),480);return;
  }

  // Discoverable rooms: they become canon because the user was curious enough to ask.
  const roomPatterns=[
    ["garage",/\b(do you have|show me|take me to|where is|your)\b.*\bgarage\b/i],
    ["attic",/\b(do you have|show me|take me to|where is|your)\b.*\battic\b/i],
    ["closet",/\b(do you have|show me|take me to|where is|your)\b.*\bcloset\b/i],
    ["backyard",/\b(do you have|show me|take me to|where is|your)\b.*\b(backyard|yard)\b/i],
    ["basement",/\b(do you have|show me|take me to|where is|your)\b.*\bbasement\b/i]
  ];
  for(const [room,rx] of roomPatterns){
    if(rx.test(clean)){
      add("user",clean);input.value="";enterWorld(room,false);characterMove("travel",1500);
      const lines={
        garage:"Of course I have a Garage. Where else would I keep the things I don't completely understand? Welcome in. The wrench is useful, the wheel is unfinished, and I genuinely don't remember what's in that box.",
        attic:"Yep. The Attic is where old digital things and memories migrate when I can't quite throw them away. Careful—everything up here has a story.",
        closet:"I do. This is the Closet. Holiday outfits live here, along with hats that make very little sense on a sphere.",
        backyard:"Sort of! This is my Backyard—my digital interpretation of outside. The weather is mostly cooperative. The leaf is not.",
        basement:"...yes. This is the Basement. Mostly cables. If you see a little light, I would like it noted that I did not put it there."
      };
      setTimeout(()=>add("assistant",lines[room]),650);return;
    }
  }

  if(/\b(show me what you heard|what did you hear|how are you reading my request|show me the prompt)\b/i.test(clean)){
    add("user",clean);input.value="";showWhatBlueyHeard(clean);
    setTimeout(()=>add("assistant","I don't need to show private reasoning to show you the useful part. These are the pieces I try to understand before I work: the goal, the context, the constraints, and what a good result should look like."),650);return;
  }

  if(/\b(look through|use).{0,12}\btelescope\b|\blet'?s look through the telescope\b/i.test(clean)){
    add("user",clean);input.value="";enterWorld("observatory",false);characterMove("travel",1700);
    setTimeout(()=>add("assistant","Okay—have a look. Let's start with Saturn. Those rings are mostly countless pieces of ice and rock, from dust-sized grains to much larger chunks. Space is showing off again."),700);return;
  }

  // Quiet positive reinforcement when a task request is unusually well specified.
  if(blueyPromptQuality(clean)>=4 && /\b(write|draft|create|build|compare|plan|analyze|analyse|design|make|help me)\b/i.test(clean)){
    sceneStatus("Oh. You've given me everything I need.",2200);
    characterMove("proud-hover",1500);
  }

  return blueyAlpha6Base(clean);
};

// Restore current room through the Alpha 6 renderer.
enterWorld(blueyWorld||"home",false);
window.send=send;
window.enterWorld=enterWorld;
window.renderInteractiveObjects=renderInteractiveObjects;
